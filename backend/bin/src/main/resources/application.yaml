spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: backend

  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autopartco}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD}"
    driver-class-name: "org.postgresql.Driver"

  mail:
    host: "${MAIL_HOST:localhost}"
    port: "${MAIL_PORT:1025}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    properties:
      "[mail.smtp.auth]": "${MAIL_AUTH:false}"
      "[mail.smtp.starttls.enable]": "${MAIL_STARTTLS:false}"

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      "[hibernate.format_sql]": true

server:
  port: "${SERVER_PORT:8080}"

app:
  public-base-url: "${APP_PUBLIC_BASE_URL:http://localhost:8080}"
  email-verification:
    expires-minutes: "${EMAIL_VERIFICATION_EXPIRES_MINUTES:30}"
    from: "${MAIL_FROM:no-reply@autopartco.com}"
  password-recovery:
    expires-minutes: "${PASSWORD_RECOVERY_EXPIRES_MINUTES:15}"
  tokens:
    access-expires-minutes: "${ACCESS_TOKEN_EXPIRES_MINUTES:5}"
    refresh-expires-days: "${REFRESH_TOKEN_EXPIRES_DAYS:30}"
  cors:
    allowed-origins:
      "http://localhost:5173,http://localhost:5174"

rsa:
  public-key: ${RSA_PUBLIC_KEY_PATH:classpath:certs/pub.pem}
  private-key: ${RSA_PRIVATE_KEY_PATH:classpath:certs/pri.pem}

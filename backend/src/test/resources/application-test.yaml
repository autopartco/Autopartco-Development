# Perfil de pruebas de integracion. Aisla el contexto de la BD real definida en backend/.env:
# - URL/usuario/clave fijos e inalcanzables (puerto 1, sin variables DB_*), asi que ningun valor de .env se usa.
# - ddl-auto none: Hibernate nunca emite DDL.
# - Sin acceso a metadatos JDBC ni conexion inicial: el contexto arranca sin tocar ninguna base de datos.
# Las pruebas que necesiten consultas reales deben ser unitarias (mocks) o usar una BD embebida/Testcontainers
# (requiere dependencia en pom.xml; ver ADR-0001).
spring:
  datasource:
    url: "jdbc:postgresql://127.0.0.1:1/autopartco_test_isolated"
    username: "test"
    password: "test"
    hikari:
      initialization-fail-timeout: -1
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      "[hibernate.boot.allow_jdbc_metadata_access]": false

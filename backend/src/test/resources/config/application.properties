# Solo para pruebas. Spring Modulith 2.1.1 lee esta propiedad (ConfigData de classpath) al construir
# ApplicationModules; registrar la estrategia en spring.factories está obsoleto en 2.1.1.
# Va en classpath:/config/ para no ocultar ningún application.* de src/main/resources.
spring.modulith.detection-strategy=com.autopartco.backend.modularity.AutopartcoModuleDetection

spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: backend

  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autopartco}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD}"
    driver-class-name: "org.postgresql.Driver"

  mail:
    host: "${MAIL_HOST:localhost}"
    port: "${MAIL_PORT:1025}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    properties:
      "[mail.smtp.auth]": "${MAIL_AUTH:false}"
      "[mail.smtp.starttls.enable]": "${MAIL_STARTTLS:false}"

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 35MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      "[hibernate.format_sql]": true

server:
  port: "${SERVER_PORT:8081}"

supabase:
  url: "${SUPABASE_URL:}"
  service-key: "${SUPABASE_SERVICE_KEY:${SUPABASE_SECRET_KEY:}}"
  bucket: "${SUPABASE_BUCKET:${SUPABASE_BUCKET_PRODUCTS_IMGS:products-images}}"
  business-bucket: "${SUPABASE_BUCKET_BUSINESS:bussniess}"

wompi:
  public-key: "${WOMPI_PUBLIC_KEY:}"
  integrity-secret: "${WOMPI_INTEGRITY_SECRET:}"
  events-secret: "${WOMPI_EVENTS_SECRET:}"
  checkout-url: "${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/p/}"
  redirect-url: "${WOMPI_REDIRECT_URL:http://localhost:5173/seller/payment-result}"

app:
  public-base-url: "${APP_PUBLIC_BASE_URL:http://localhost:8081}"
  frontend-base-url: "${APP_FRONTEND_BASE_URL:http://localhost:5173}"
  email-verification:
    expires-minutes: "${EMAIL_VERIFICATION_EXPIRES_MINUTES:30}"
    from: "${MAIL_FROM:no-reply@autopartco.com}"
  password-recovery:
    expires-minutes: "${PASSWORD_RECOVERY_EXPIRES_MINUTES:15}"
  tokens:
    access-expires-minutes: "${ACCESS_TOKEN_EXPIRES_MINUTES:5}"
    refresh-expires-days: "${REFRESH_TOKEN_EXPIRES_DAYS:30}"
  cors:
    allowed-origins:
      "http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174"

rsa:
  public-key: ${RSA_PUBLIC_KEY_PATH:classpath:certs/pub.pem}
  private-key: ${RSA_PRIVATE_KEY_PATH:classpath:certs/pri.pem}

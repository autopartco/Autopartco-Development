spring:
  config:
    # Único .env en la raíz del repo (mvn spring-boot:run corre desde backend/).
    import: "optional:file:../.env[.properties]"

  # Desde el .env importado, SPRING_PROFILES_ACTIVE no se mapea solo a spring.profiles.active.
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:dev}"

  application:
    name: backend

  # Redis es opcional (shared/cache). La autoconfiguración de Boot queda excluida: sin REDIS_URL nunca se intenta
  # localhost:6379 ni aparece Redis en /actuator/health; con REDIS_URL la conexión la arma shared/cache/RedisConfig.
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.observation.LettuceObservationAutoConfiguration

  data:
    redis:
      # redis://[usuario:clave@]host:puerto[/db] o rediss:// (TLS). Vacío: cachés y limitadores en memoria.
      url: "${REDIS_URL:}"
      connect-timeout: "${REDIS_CONNECT_TIMEOUT:500ms}"
      timeout: "${REDIS_COMMAND_TIMEOUT:200ms}"

  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autopartco}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD}"
    driver-class-name: "org.postgresql.Driver"

  mail:
    host: "${MAIL_HOST:localhost}"
    port: "${MAIL_PORT:1025}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    properties:
      "[mail.smtp.auth]": "${MAIL_AUTH:false}"
      "[mail.smtp.starttls.enable]": "${MAIL_STARTTLS:false}"

  servlet:
    multipart:
      # 10MB por archivo: los documentos de la solicitud de vendedor admiten hasta 10MB. Las imágenes de producto
      # se limitan a 5MB en ProductImageValidator (413 PRODUCT_IMAGE_TOO_LARGE).
      max-file-size: 10MB
      # Alta/edición atómica de producto: parte data + hasta 10 imágenes de 5MB.
      max-request-size: 55MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      "[hibernate.format_sql]": true

server:
  port: "${SERVER_PORT:8081}"
  tomcat:
    # Partes por petición multipart (archivos + campos). El alta de producto usa data + hasta 10 imágenes.
    max-part-count: 20

supabase:
  url: "${SUPABASE_URL:}"
  service-key: "${SUPABASE_SERVICE_KEY:${SUPABASE_SECRET_KEY:}}"
  bucket: "${SUPABASE_BUCKET:${SUPABASE_BUCKET_PRODUCTS_IMGS:products-images}}"
  business-bucket: "${SUPABASE_BUCKET_BUSINESS:bussniess}"

image:
  # Proveedor de miniaturas: none (URL pública de Supabase) | wsrv | cloudinary | openinary. Ver docs/backend/product-images.md.
  provider: "${IMAGE_PROVIDER:none}"
  cloudinary:
    cloud-name: "${CLOUDINARY_CLOUD_NAME:}"

openinary:
  base-url: "${OPENINARY_URL:}"

# ADR 0004. Se valida al arrancar (core.payments.internal.WompiConfigurationValidator): prefijos de llaves según el
# entorno (pub_test_/prv_test_ en SANDBOX, pub_prod_/prv_prod_ en PRODUCTION), https en PRODUCTION y sin
# simuladores en el perfil prod. La URL de la API se deriva del entorno.
wompi:
  environment: "${WOMPI_ENVIRONMENT:SANDBOX}"
  public-key: "${WOMPI_PUBLIC_KEY:}"
  # Solo backend: consulta de transacciones (sync y conciliación).
  private-key: "${WOMPI_PRIVATE_KEY:}"
  integrity-secret: "${WOMPI_INTEGRITY_SECRET:}"
  events-secret: "${WOMPI_EVENTS_SECRET:}"
  checkout-url: "${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/p/}"
  redirect-url: "${WOMPI_REDIRECT_URL:http://localhost:5173/portal/pago/resultado}"

app:
  public-base-url: "${APP_PUBLIC_BASE_URL:http://localhost:8081}"
  # Ingreso social. Vacío: el proveedor queda deshabilitado (POST /auth/social/{provider} responde 404).
  social:
    google:
      client-id: "${GOOGLE_CLIENT_ID:}"
    facebook:
      app-id: "${FACEBOOK_APP_ID:}"
      app-secret: "${FACEBOOK_APP_SECRET:}"
  billing:
    # Cobro simulado del portal (sin pasarela). Apagado por defecto: solo local y demo lo encienden.
    simulated-payments-enabled: "${SIMULATED_PAYMENTS_ENABLED:false}"
    # Conciliación de pagos de suscripción Wompi PENDING (SubscriptionPaymentReconciler).
    payment-reconciliation-enabled: "${APP_BILLING_PAYMENT_RECONCILIATION_ENABLED:true}"
    payment-reconciliation-initial-delay-ms: "${APP_BILLING_PAYMENT_RECONCILIATION_INITIAL_DELAY_MS:90000}"
    payment-reconciliation-delay-ms: "${APP_BILLING_PAYMENT_RECONCILIATION_DELAY_MS:300000}"
  checkout:
    # SIMULATED | WOMPI. Sin valor fuera de prod equivale a SIMULATED; en el perfil prod es obligatorio y no puede
    # ser SIMULATED. El simulador del checkout solo está activo con SIMULATED (APP_CHECKOUT_SIMULATED_PAYMENTS_ENABLED
    # ya no se usa).
    payment-provider: "${APP_CHECKOUT_PAYMENT_PROVIDER:}"
    # Minutos de reserva del stock mientras se espera el pago Wompi del pedido.
    reservation-minutes: "${APP_CHECKOUT_RESERVATION_MINUTES:30}"
    # Conciliación con Wompi y vencimiento de reservas de pedidos (MarketplacePaymentJobs).
    payment-jobs-enabled: "${APP_CHECKOUT_PAYMENT_JOBS_ENABLED:true}"
    payment-jobs-initial-delay-ms: "${APP_CHECKOUT_PAYMENT_JOBS_INITIAL_DELAY_MS:60000}"
    payment-jobs-delay-ms: "${APP_CHECKOUT_PAYMENT_JOBS_DELAY_MS:300000}"
  frontend-base-url: "${APP_FRONTEND_BASE_URL:http://localhost:5173}"
  cache:
    redis:
      # Tras un fallo de Redis, tiempo durante el que se usa solo la memoria antes de reintentar.
      retry-after: "${APP_CACHE_REDIS_RETRY_AFTER:30s}"
  http-cache:
    # ETag débil y Cache-Control en los GET públicos del marketplace (shared/web/MarketplaceHttpCacheFilter).
    enabled: "${APP_HTTP_CACHE_ENABLED:true}"
  auth-rate-limit:
    # Por IP y ruta en login, verificación y reenvíos de /auth (shared/web/AuthRateLimitInterceptor).
    per-minute: "${APP_AUTH_RATE_LIMIT_PER_MINUTE:10}"
  email-verification:
    expires-minutes: "${EMAIL_VERIFICATION_EXPIRES_MINUTES:30}"
    from: "${MAIL_FROM:no-reply@autopartco.com}"
  password-recovery:
    expires-minutes: "${PASSWORD_RECOVERY_EXPIRES_MINUTES:15}"
  tokens:
    access-expires-minutes: "${ACCESS_TOKEN_EXPIRES_MINUTES:5}"
    refresh-expires-days: "${REFRESH_TOKEN_EXPIRES_DAYS:30}"
  auth:
    # Cookie del refresh token: true solo con HTTPS (producción).
    cookie-secure: "${AUTH_COOKIE_SECURE:false}"
  cors:
    allowed-origins:
      "http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174"

rsa:
  public-key: ${RSA_PUBLIC_KEY_PATH:classpath:certs/pub.pem}
  private-key: ${RSA_PRIVATE_KEY_PATH:classpath:certs/pri.pem}
